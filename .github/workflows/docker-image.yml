name: Docker Image CI

on:
  push:
    branches: [ "main", "review-logger" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: 
          - name: backend
            context: ./backend
          - name: frontend
            context: ./frontend
          - name: nginx
            context: ./nginx

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ${{ matrix.service.context }}
        file: ${{ matrix.service.context }}/Dockerfile
        push: ${{ github.event_name != 'pull_request' }}
        tags: |
          ${{ env.REGISTRY }}/${{ github.repository_owner }}/film-${{ matrix.service.name }}:latest
          ${{ env.REGISTRY }}/${{ github.repository_owner }}/film-${{ matrix.service.name }}:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build  
    if: github.event_name != 'pull_request'
    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 158.160.223.181
          username: igr0ks2026
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/film-react-nest
            docker compose pull
            docker compose up -d
            docker system prune -f
