services:
  frontend:
    image: ghcr.io/alekigsm/film-frontend:latest
    build:
      context: frontend
      dockerfile: Dockerfile
    env_file:
      - frontend/.env
    volumes:
      - frontend_dist:/app/dist
    networks:
      - app-network
    command: echo "Frontend built successfully"

  backend:
    image: ghcr.io/alekigsm/film-backend:latest
    build:
      context: backend
    env_file:
      - backend/.env
    environment:
      - DB_HOST=postgres
    volumes:
      - ./backend/src:/app/src
      - public:/app/src/public
    ports:
      - 3000:3000
    depends_on:
      - postgres
    networks:
      - app-network
    restart: on-failure

  nginx:
    image: ghcr.io/alekigsm/film-nginx:latest
    build:
      context: nginx
      dockerfile: Dockerfile
    ports:
      - 80:80
      - 443:443
    depends_on:
      - frontend
      - backend
    networks:
      - app-network
    restart: always
    volumes:
      - frontend_dist:/usr/share/nginx/html
      - public:/var/public
      - ./certbot/www/:/var/www/certbot/:ro
      - ./certbot/conf/:/etc/letsencrypt/:ro

  certbot:
    image: certbot/certbot:latest
    networks:
      - app-network
    volumes:
      - ./certbot/www/:/var/www/certbot/:rw
      - ./certbot/conf/:/etc/letsencrypt/:rw

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file:
      - backend/.env
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    ports:
      - 8080:80
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - app-network
    restart: unless-stopped

volumes:
  frontend_dist:
  public:
  db_data:
  pgadmin_data:

networks:
  app-network:
    driver: bridge
