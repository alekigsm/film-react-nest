events {
    worker_connections 1024;
}

http {
    # Подключаем стандартные типы файлов
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # HTTPS сервер
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name film.nomorepartiessite.ru;

        # Правильные пути к сертификатам для вашего домена
        ssl_certificate /etc/letsencrypt/live/film.nomorepartiessite.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/film.nomorepartiessite.ru/privkey.pem;

        # Оптимальные настройки SSL
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Корневая папка с фронтендом
        root /usr/share/nginx/html;
        index index.html;

        # Основной location для фронтенда (React)
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Прокси для API (проверьте порт - у вас 3000)
        location /api/ {
            proxy_pass http://backend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Прокси для контента
        location /content/ {
            proxy_pass http://backend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

    }
     # HTTP сервер - перенаправляет на HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name film.nomorepartiessite.ru 158.160.223.181;

        # Для проверки домена Certbot (важно для обновления сертификатов)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Все остальное перенаправляем на HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }
}