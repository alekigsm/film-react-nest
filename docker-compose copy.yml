services:
  # Твой бэкенд (из твоего Dockerfile)
  backend:
    build: ./backend
    image: film-backend:latest
    container_name: film-backend
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=postgres # ← имя сервиса БД
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - DB_DATABASE=filmdb
    networks:
      - film-network
    depends_on:
      - postgres # ← ждем пока БД запустится
    restart: unless-stopped

  # Твой фронтенд (из твоего Dockerfile)
  frontend:
    build: ./frontend
    container_name: film-frontend-builder
    volumes:
      - frontend_dist:/app/dist
    networks:
      - film-network
    command: echo "Frontend built successfully"

  # Твой nginx (из твоего Dockerfile)
  nginx:
    build: ./nginx
    container_name: film-nginx
    ports:
      - "80:80"
    volumes:
      - frontend_dist:/usr/share/nginx/html:ro
    networks:
      - film-network
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  # PostgreSQL (готовый образ, НЕ НУЖЕН Dockerfile!)
  postgres:
    image: postgres:15-alpine # ← готовый образ!
    container_name: film-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=filmdb
    volumes:
      - postgres_data:/var/lib/postgresql/data # ← volume для данных
    networks:
      - film-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgAdmin (готовый образ, НЕ НУЖЕН Dockerfile!)
  pgadmin:
    image: dpage/pgadmin4 # ← готовый образ!
    container_name: film-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80" # ← админка доступна на порту 5050
    volumes:
      - pgadmin_data:/var/lib/pgadmin # ← volume для настроек
    networks:
      - film-network
    depends_on:
      - postgres
    restart: unless-stopped
    profiles:
      - dev # ← только для разработки

# Сети
networks:
  film-network:
    driver: bridge

# Volumes (для сохранения данных)
volumes:
  frontend_dist:
    driver: local
  postgres_data:
    driver: local # ← данные БД сохранятся даже после остановки
  pgadmin_data:
    driver: local # ← настройки pgAdmin сохранятся